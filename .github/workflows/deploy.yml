name: CI-CD-EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

# Prevent two Terraform operations from using the same state
# at the same time.
concurrency:
  group: cicd-eks-rds-terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  CLUSTER_NAME: cicd-eks-rds
  DOCKER_IMAGE: kanavenavamshi/sample-app2

jobs:

  infrastructure-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ==========================================================
      # VERIFY AWS
      # IMPORTANT:
      # Do NOT use "aws configure get region"
      # ==========================================================

      - name: Verify AWS configuration
        run: |
          echo "========================================="
          echo "AWS CONFIGURATION"
          echo "========================================="

          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS CLI version:"
          aws --version

          echo ""
          echo "Checking EC2 access:"
          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --query 'Vpcs[].VpcId' \
            --output table


      # ==========================================================
      # DOCKER LOGIN
      # Only for APPLY
      # ==========================================================

      - name: Login to Docker Hub
        if: ${{ inputs.action == 'apply' }}
        uses: docker/login-action@v3
        with:
          username: kanavenavamshi
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # BUILD DOCKER IMAGE
      # Only for APPLY
      # ==========================================================

      - name: Build Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker build \
            -t $DOCKER_IMAGE:${{ github.sha }} \
            ./app

          docker tag \
            $DOCKER_IMAGE:${{ github.sha }} \
            $DOCKER_IMAGE:latest


      # ==========================================================
      # PUSH DOCKER IMAGE
      # Only for APPLY
      # ==========================================================

      - name: Push Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker push $DOCKER_IMAGE:${{ github.sha }}
          docker push $DOCKER_IMAGE:latest


      # ==========================================================
      # SETUP TERRAFORM
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -reconfigure


      # ==========================================================
      # TERRAFORM FORMAT
      # ==========================================================

      - name: Terraform Format
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive


      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # ==========================================================
      # TERRAFORM PLAN
      # Only for APPLY
      # ==========================================================

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform plan -out=tfplan


      # ==========================================================
      # TERRAFORM APPLY
      # Only for APPLY
      # ==========================================================

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan


      # ==========================================================
      # VERIFY VPC / NAT AFTER TERRAFORM
      # Only for APPLY
      # ==========================================================

      - name: Verify VPC and NAT Gateway
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "VPC CHECK"
          echo "========================================="

          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${CLUSTER_NAME}-vpc" \
            --query 'Vpcs[].{VpcId:VpcId,CIDR:CidrBlock,State:State}' \
            --output table


          echo ""
          echo "========================================="
          echo "NAT GATEWAY CHECK"
          echo "========================================="

          aws ec2 describe-nat-gateways \
            --region "$AWS_REGION" \
            --filter "Name=state,Values=available,pending" \
            --query 'NatGateways[].{ID:NatGatewayId,State:State,VPC:VpcId,Subnet:SubnetId}' \
            --output table


      # ==========================================================
      # VERIFY PRIVATE ROUTES
      # Only for APPLY
      # ==========================================================

      - name: Verify private subnet routes
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "PRIVATE SUBNET ROUTES"
          echo "========================================="

          VPC_ID=$(aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=${CLUSTER_NAME}-vpc" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          echo "VPC ID: $VPC_ID"

          aws ec2 describe-route-tables \
            --region "$AWS_REGION" \
            --filters "Name=vpc-id,Values=$VPC_ID" \
            --query 'RouteTables[].{
              RouteTableId:RouteTableId,
              Routes:Routes[].{
                Destination:DestinationCidrBlock,
                NAT:NatGatewayId,
                Gateway:GatewayId
              }
            }' \
            --output json


      # ==========================================================
      # SETUP KUBECTL
      # Only for APPLY
      # ==========================================================

      - name: Setup kubectl
        if: ${{ inputs.action == 'apply' }}
        uses: azure/setup-kubectl@v4


      # ==========================================================
      # WAIT FOR EKS CLUSTER
      # Only for APPLY
      # ==========================================================

      - name: Wait for EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Waiting for EKS cluster..."

          aws eks wait cluster-active \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          echo "EKS cluster is ACTIVE."


      # ==========================================================
      # CHECK EKS CLUSTER
      # Only for APPLY
      # ==========================================================

      - name: Check EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            --query 'cluster.{Name:name,Status:status,Version:version,Endpoint:endpoint}' \
            --output table


      # ==========================================================
      # CONFIGURE KUBECONFIG
      # Only for APPLY
      # ==========================================================

      - name: Configure kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # ==========================================================
      # WAIT FOR NODE GROUP
      # Only for APPLY
      # ==========================================================

      - name: Wait for EKS node group
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "WAITING FOR NODE GROUP"
          echo "========================================="

          for i in {1..60}
          do

            STATUS=$(aws eks describe-nodegroup \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "${CLUSTER_NAME}-nodes" \
              --region "$AWS_REGION" \
              --query 'nodegroup.status' \
              --output text 2>/dev/null || echo "NOT_FOUND")

            echo "Node group status: $STATUS"

            if [ "$STATUS" = "ACTIVE" ]; then
              echo "Node group is ACTIVE."
              break
            fi

            if [ "$STATUS" = "CREATE_FAILED" ]; then
              echo "Node group creation FAILED."

              aws eks describe-nodegroup \
                --cluster-name "$CLUSTER_NAME" \
                --nodegroup-name "${CLUSTER_NAME}-nodes" \
                --region "$AWS_REGION" \
                --query 'nodegroup.health.issues' \
                --output json

              exit 1
            fi

            echo "Waiting 30 seconds..."
            sleep 30

          done

          FINAL_STATUS=$(aws eks describe-nodegroup \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "${CLUSTER_NAME}-nodes" \
            --region "$AWS_REGION" \
            --query 'nodegroup.status' \
            --output text)

          echo "Final node group status: $FINAL_STATUS"

          if [ "$FINAL_STATUS" != "ACTIVE" ]; then
            echo "Node group did not become ACTIVE."
            exit 1
          fi


      # ==========================================================
      # VERIFY KUBERNETES CONNECTION
      # Only for APPLY
      # ==========================================================

      - name: Check Kubernetes connection
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "KUBERNETES CONNECTION"
          echo "========================================="

          kubectl cluster-info

          echo ""
          echo "Nodes:"
          kubectl get nodes -o wide


      # ==========================================================
      # CREATE / UPDATE DATABASE SECRET
      # Only for APPLY
      # ==========================================================

      - name: Create database secret
        if: ${{ inputs.action == 'apply' }}
        env:
          DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          kubectl create secret generic db-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ==========================================================
      # DEPLOY APPLICATION
      # Only for APPLY
      # ==========================================================

      - name: Deploy application
        if: ${{ inputs.action == 'apply' }}
        run: |

          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      # ==========================================================
      # UPDATE DOCKER IMAGE
      # Only for APPLY
      # ==========================================================

      - name: Update deployment image
        if: ${{ inputs.action == 'apply' }}
        run: |

          kubectl set image deployment/sample-app \
            sample-app=$DOCKER_IMAGE:${{ github.sha }}


      # ==========================================================
      # WAIT FOR ROLLOUT
      # Only for APPLY
      # ==========================================================

      - name: Wait for rollout
        if: ${{ inputs.action == 'apply' }}
        run: |

          kubectl rollout status deployment/sample-app \
            --timeout=300s


      # ==========================================================
      # CHECK PODS
      # Only for APPLY
      # ==========================================================

      - name: Check Kubernetes pods
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "PODS"
          echo "========================================="

          kubectl get pods -o wide


      # ==========================================================
      # CHECK SERVICE
      # Only for APPLY
      # ==========================================================

      - name: Check Kubernetes service
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "SERVICES"
          echo "========================================="

          kubectl get svc


      # ==========================================================
      # TERRAFORM DESTROY
      # Only for DESTROY
      # ==========================================================

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          echo "========================================="
          echo "TERRAFORM DESTROY"
          echo "========================================="

          terraform destroy \
            -auto-approve
