name: CI-CD-EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-infra-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4


      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: kanavenavamshi
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t kanavenavamshi/sample-app2:${{ github.sha }} ./app
          docker tag kanavenavamshi/sample-app2:${{ github.sha }} kanavenavamshi/sample-app2:latest


      # Push Docker image
      - name: Push Docker image
        run: |
          docker push kanavenavamshi/sample-app2:${{ github.sha }}
          docker push kanavenavamshi/sample-app2:latest


      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # Verify AWS credentials
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity


      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # Terraform Init
      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init


      # Terraform Format Check
      - name: Terraform Format
        working-directory: ./terraform
        run: |
          terraform fmt -check


      # Terraform Validate
      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # Terraform Plan
      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform plan -out=tfplan


      # Terraform Apply
      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform apply -auto-approve tfplan


      # Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4


      # Configure EKS kubeconfig
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region eu-north-1 \
            --name cicd-eks-rds


      # Deploy application to Kubernetes
      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      # Update application image
      - name: Update deployment image
        run: |
          kubectl set image deployment/sample-app \
            sample-app=kanavenavamshi/sample-app2:${{ github.sha }}


      # Wait for Kubernetes rollout
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sample-app --timeout=300s


      # Check pods
      - name: Check Kubernetes Pods
        run: |
          kubectl get pods -o wide


      # Check LoadBalancer
      - name: Check Kubernetes Service
        run: |
          kubectl get svc
