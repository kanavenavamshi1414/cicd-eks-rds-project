name: CI-CD-EKS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-infra-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:${{ github.sha }}" ./app
          docker tag "${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:${{ github.sha }}" "${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:latest"

      - name: Push Docker image
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:${{ github.sha }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan -var="aws_region=eu-north-1" -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve tfplan

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --region eu-north-1 --name cicd-eks-rds

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Update deployment image
        run: |
          kubectl set image deployment/sample-app sample-app=${{ secrets.DOCKERHUB_USERNAME }}/sample-app2:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sample-app --timeout=300s

      - name: Check Kubernetes Pods
        run: |
          kubectl get pods -o wide

      - name: Check Kubernetes Service
        run: |
          kubectl get svc
