name: CI-CD-EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: cicd-eks-rds-terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  CLUSTER_NAME: cicd-eks-rds
  DOCKER_IMAGE: kanavenavamshi/sample-app2

jobs:

  infrastructure-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # VERIFY AWS
      # ==========================================================

      - name: Verify AWS configuration
        run: |

          echo "========================================="
          echo "AWS CONFIGURATION"
          echo "========================================="

          echo "Region:"
          echo "$AWS_REGION"

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS CLI:"
          aws --version

          echo ""
          echo "EC2 VPC CHECK:"

          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --query 'Vpcs[].VpcId' \
            --output table


      # ==========================================================
      # DOCKER LOGIN
      # APPLY ONLY
      # ==========================================================

      - name: Login to Docker Hub
        if: ${{ inputs.action == 'apply' }}
        uses: docker/login-action@v3
        with:
          username: kanavenavamshi
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # BUILD DOCKER IMAGE
      # APPLY ONLY
      # ==========================================================

      - name: Build Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "BUILD DOCKER IMAGE"
          echo "========================================="

          docker build \
            -t "$DOCKER_IMAGE:${{ github.sha }}" \
            ./app

          docker tag \
            "$DOCKER_IMAGE:${{ github.sha }}" \
            "$DOCKER_IMAGE:latest"


      # ==========================================================
      # PUSH DOCKER IMAGE
      # APPLY ONLY
      # ==========================================================

      - name: Push Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "PUSH DOCKER IMAGE"
          echo "========================================="

          docker push "$DOCKER_IMAGE:${{ github.sha }}"
          docker push "$DOCKER_IMAGE:latest"


      # ==========================================================
      # TERRAFORM
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================

      - name: Terraform Init
        working-directory: ./terraform
        run: |

          terraform init -reconfigure


      # ==========================================================
      # TERRAFORM FORMAT
      # ==========================================================

      - name: Terraform Format
        working-directory: ./terraform
        run: |

          terraform fmt -check -recursive


      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        run: |

          terraform validate


      # ==========================================================
      # TERRAFORM PLAN
      # APPLY ONLY
      # ==========================================================

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          terraform plan -out=tfplan


      # ==========================================================
      # TERRAFORM APPLY
      # APPLY ONLY
      # ==========================================================

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          echo "========================================="
          echo "TERRAFORM APPLY"
          echo "========================================="

          terraform apply \
            -auto-approve \
            tfplan


      # ==========================================================
      # WAIT FOR EKS CLUSTER
      # APPLY ONLY
      # ==========================================================

      - name: Wait for EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "WAITING FOR EKS CLUSTER"
          echo "========================================="

          aws eks wait cluster-active \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          echo "EKS cluster is ACTIVE."


      # ==========================================================
      # EKS INFORMATION
      # APPLY ONLY
      # ==========================================================

      - name: Check EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "EKS CLUSTER"
          echo "========================================="

          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            --query 'cluster.{Name:name,Status:status,Version:version,Endpoint:endpoint,Authentication:accessConfig.authenticationMode}' \
            --output table


      # ==========================================================
      # SETUP KUBECTL
      # APPLY ONLY
      # ==========================================================

      - name: Setup kubectl
        if: ${{ inputs.action == 'apply' }}
        uses: azure/setup-kubectl@v4


      # ==========================================================
      # CONFIGURE KUBECONFIG
      # APPLY ONLY
      # ==========================================================

      - name: Configure kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "CONFIGURING KUBECONFIG"
          echo "========================================="

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          echo ""
          echo "Current context:"

          kubectl config current-context


      # ==========================================================
      # WAIT FOR NODE GROUP
      # APPLY ONLY
      # ==========================================================

      - name: Wait for EKS node group
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "WAITING FOR NODE GROUP"
          echo "========================================="

          for i in {1..60}
          do

            STATUS=$(aws eks describe-nodegroup \
              --region "$AWS_REGION" \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "${CLUSTER_NAME}-nodes" \
              --query 'nodegroup.status' \
              --output text 2>/dev/null || echo "NOT_FOUND")

            echo "Attempt $i/60"
            echo "Node group status: $STATUS"

            if [ "$STATUS" = "ACTIVE" ]; then
              echo ""
              echo "Node group is ACTIVE."
              break
            fi

            if [ "$STATUS" = "CREATE_FAILED" ]; then

              echo "Node group creation FAILED."

              aws eks describe-nodegroup \
                --region "$AWS_REGION" \
                --cluster-name "$CLUSTER_NAME" \
                --nodegroup-name "${CLUSTER_NAME}-nodes" \
                --query 'nodegroup.health.issues' \
                --output json

              exit 1
            fi

            sleep 20

          done

          FINAL_STATUS=$(aws eks describe-nodegroup \
            --region "$AWS_REGION" \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "${CLUSTER_NAME}-nodes" \
            --query 'nodegroup.status' \
            --output text)

          echo ""
          echo "Final node group status: $FINAL_STATUS"

          if [ "$FINAL_STATUS" != "ACTIVE" ]; then

            echo "Node group did not become ACTIVE."

            aws eks describe-nodegroup \
              --region "$AWS_REGION" \
              --cluster-name "$CLUSTER_NAME" \
              --nodegroup-name "${CLUSTER_NAME}-nodes" \
              --query 'nodegroup.health.issues' \
              --output json

            exit 1

          fi


      # ==========================================================
      # EKS NODE CHECK
      # APPLY ONLY
      # ==========================================================

      - name: Check EKS nodes
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "EKS NODES"
          echo "========================================="

          aws eks describe-nodegroup \
            --region "$AWS_REGION" \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name "${CLUSTER_NAME}-nodes" \
            --query 'nodegroup.{Status:status,Subnets:subnets,InstanceTypes:instanceTypes,Desired:scalingConfig.desiredSize}' \
            --output table


      # ==========================================================
      # KUBERNETES CONNECTION
      # APPLY ONLY
      # ==========================================================

      - name: Check Kubernetes connection
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "KUBERNETES CONNECTION"
          echo "========================================="

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "EKS Token:"
          aws eks get-token \
            --region "$AWS_REGION" \
            --cluster-name "$CLUSTER_NAME" \
            --output json > /tmp/eks-token.json

          echo "EKS token generated successfully."

          echo ""
          echo "Cluster info:"

          kubectl cluster-info

          echo ""
          echo "Nodes:"

          kubectl get nodes -o wide


      # ==========================================================
      # DATABASE SECRET
      # APPLY ONLY
      # ==========================================================

      - name: Create database secret
        if: ${{ inputs.action == 'apply' }}
        env:
          DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          echo "========================================="
          echo "DATABASE SECRET"
          echo "========================================="

          kubectl create secret generic db-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ==========================================================
      # DEPLOY APPLICATION
      # APPLY ONLY
      # ==========================================================

      - name: Deploy application
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "DEPLOY APPLICATION"
          echo "========================================="

          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      # ==========================================================
      # UPDATE IMAGE
      # APPLY ONLY
      # ==========================================================

      - name: Update deployment image
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "UPDATE IMAGE"
          echo "========================================="

          kubectl set image deployment/sample-app \
            sample-app="$DOCKER_IMAGE:${{ github.sha }}"


      # ==========================================================
      # ROLLOUT
      # APPLY ONLY
      # ==========================================================

      - name: Wait for rollout
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "WAITING FOR ROLLOUT"
          echo "========================================="

          kubectl rollout status deployment/sample-app \
            --timeout=300s


      # ==========================================================
      # POD CHECK
      # APPLY ONLY
      # ==========================================================

      - name: Check Kubernetes pods
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "PODS"
          echo "========================================="

          kubectl get pods -o wide


      # ==========================================================
      # SERVICE CHECK
      # APPLY ONLY
      # ==========================================================

      - name: Check Kubernetes service
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "SERVICES"
          echo "========================================="

          kubectl get svc -o wide


      # ==========================================================
      # LOAD BALANCER CHECK
      # APPLY ONLY
      # ==========================================================

      - name: Check LoadBalancer
        if: ${{ inputs.action == 'apply' }}
        run: |

          echo "========================================="
          echo "LOAD BALANCER"
          echo "========================================="

          kubectl get svc \
            --all-namespaces \
            -o wide


      # ==========================================================
      # TERRAFORM DESTROY
      # ==========================================================

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |

          echo "========================================="
          echo "TERRAFORM DESTROY"
          echo "========================================="

          terraform destroy \
            -auto-approve
