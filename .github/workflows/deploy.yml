name: CI-CD-EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

# Prevent multiple workflows from using the same Terraform state
concurrency:
  group: cicd-eks-rds-terraform
  cancel-in-progress: false

jobs:
  infrastructure-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -------------------------
      # Login to Docker Hub
      # Only needed for APPLY
      # -------------------------
      - name: Login to Docker Hub
        if: ${{ inputs.action == 'apply' }}
        uses: docker/login-action@v3
        with:
          username: kanavenavamshi
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker build \
            -t kanavenavamshi/sample-app2:${{ github.sha }} \
            ./app

          docker tag \
            kanavenavamshi/sample-app2:${{ github.sha }} \
            kanavenavamshi/sample-app2:latest


      # -------------------------
      # Push Docker Image
      # -------------------------
      - name: Push Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker push kanavenavamshi/sample-app2:${{ github.sha }}
          docker push kanavenavamshi/sample-app2:latest


      # -------------------------
      # Configure AWS Credentials
      # -------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # -------------------------
      # Verify AWS
      # -------------------------
      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity


      # -------------------------
      # Setup Terraform
      # -------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # -------------------------
      # Terraform Init
      # -------------------------
      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init


      # -------------------------
      # Terraform Format
      # -------------------------
      - name: Terraform Format
        working-directory: ./terraform
        run: |
          terraform fmt -check


      # -------------------------
      # Terraform Validate
      # -------------------------
      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # =================================================
      # TERRAFORM APPLY
      # =================================================
      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform plan -out=tfplan

          terraform apply \
            -auto-approve \
            tfplan


      # =================================================
      # SETUP KUBECTL
      # =================================================
      - name: Setup kubectl
        if: ${{ inputs.action == 'apply' }}
        uses: azure/setup-kubectl@v4


      # -------------------------
      # Wait for EKS Cluster
      # -------------------------
      - name: Wait for EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks wait cluster-active \
            --region eu-north-1 \
            --name cicd-eks-rds


      # -------------------------
      # Configure Kubeconfig
      # -------------------------
      - name: Configure kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --region eu-north-1 \
            --name cicd-eks-rds


      # -------------------------
      # Verify Kubernetes Connection
      # -------------------------
      - name: Check Kubernetes connection
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get nodes


      # -------------------------
      # Create / Update DB Secret
      # -------------------------
      - name: Create database secret
        if: ${{ inputs.action == 'apply' }}
        env:
          DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          kubectl create secret generic db-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # -------------------------
      # Deploy Application
      # -------------------------
      - name: Deploy application
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      # -------------------------
      # Update Docker Image
      # -------------------------
      - name: Update deployment image
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl set image deployment/sample-app \
            sample-app=kanavenavamshi/sample-app2:${{ github.sha }}


      # -------------------------
      # Wait for Rollout
      # -------------------------
      - name: Wait for rollout
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl rollout status deployment/sample-app \
            --timeout=300s


      # -------------------------
      # Check Pods
      # -------------------------
      - name: Check Kubernetes Pods
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get pods -o wide


      # -------------------------
      # Check Service
      # -------------------------
      - name: Check Kubernetes Service
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get svc


      # =================================================
      # TERRAFORM DESTROY
      # =================================================
      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform destroy \
            -auto-approve
