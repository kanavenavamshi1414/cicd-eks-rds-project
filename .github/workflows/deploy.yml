name: CI-CD-EKS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

concurrency:
  group: cicd-eks-rds-terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  AWS_DEFAULT_REGION: eu-north-1
  CLUSTER_NAME: cicd-eks-rds
  DOCKER_IMAGE: kanavenavamshi/sample-app2

jobs:
  infrastructure-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout code
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1


      # ==========================================================
      # VERIFY AWS
      # ==========================================================

      - name: Verify AWS credentials
        run: |
          echo "AWS Region: $AWS_REGION"
          echo "AWS Default Region: $AWS_DEFAULT_REGION"

          aws sts get-caller-identity

          aws configure get region || true


      # ==========================================================
      # CHECK VPC / NAT BEFORE TERRAFORM
      # ==========================================================

      - name: Check AWS environment
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Checking AWS region..."
          aws configure get region

          echo "Checking EC2..."
          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --query 'Vpcs[].VpcId' \
            --output table


      # ==========================================================
      # DOCKER LOGIN
      # ==========================================================

      - name: Login to Docker Hub
        if: ${{ inputs.action == 'apply' }}
        uses: docker/login-action@v3
        with:
          username: kanavenavamshi
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================================
      # BUILD DOCKER IMAGE
      # ==========================================================

      - name: Build Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker build \
            -t $DOCKER_IMAGE:${{ github.sha }} \
            ./app

          docker tag \
            $DOCKER_IMAGE:${{ github.sha }} \
            $DOCKER_IMAGE:latest


      # ==========================================================
      # PUSH DOCKER IMAGE
      # ==========================================================

      - name: Push Docker image
        if: ${{ inputs.action == 'apply' }}
        run: |
          docker push $DOCKER_IMAGE:${{ github.sha }}
          docker push $DOCKER_IMAGE:latest


      # ==========================================================
      # SETUP TERRAFORM
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ==========================================================
      # TERRAFORM INIT
      # ==========================================================

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init -reconfigure


      # ==========================================================
      # TERRAFORM FORMAT
      # ==========================================================

      - name: Terraform Format
        working-directory: ./terraform
        run: |
          terraform fmt -check


      # ==========================================================
      # TERRAFORM VALIDATE
      # ==========================================================

      - name: Terraform Validate
        working-directory: ./terraform
        run: |
          terraform validate


      # ==========================================================
      # TERRAFORM PLAN
      # ==========================================================

      - name: Terraform Plan
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform plan -out=tfplan


      # ==========================================================
      # TERRAFORM APPLY
      # ==========================================================

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan


      # ==========================================================
      # VERIFY NAT GATEWAY
      # ==========================================================

      - name: Verify NAT Gateway
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Checking NAT Gateways..."

          aws ec2 describe-nat-gateways \
            --region "$AWS_REGION" \
            --filter "Name=state,Values=available,pending" \
            --query 'NatGateways[].{ID:NatGatewayId,State:State,Subnet:SubnetId,VPC:VpcId}' \
            --output table


      # ==========================================================
      # WAIT FOR EKS CLUSTER
      # ==========================================================

      - name: Wait for EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |
          echo "Waiting for EKS cluster..."

          aws eks wait cluster-active \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"

          echo "EKS cluster is ACTIVE."


      # ==========================================================
      # SETUP KUBECTL
      # ==========================================================

      - name: Setup kubectl
        if: ${{ inputs.action == 'apply' }}
        uses: azure/setup-kubectl@v4
        with:
          version: latest


      # ==========================================================
      # CONFIGURE KUBECONFIG
      # ==========================================================

      - name: Configure kubeconfig
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME"


      # ==========================================================
      # CHECK EKS
      # ==========================================================

      - name: Check EKS cluster
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks describe-cluster \
            --region "$AWS_REGION" \
            --name "$CLUSTER_NAME" \
            --query 'cluster.{Name:name,Status:status,Endpoint:endpoint}' \
            --output table


      # ==========================================================
      # CHECK NODE GROUP
      # ==========================================================

      - name: Check node group
        if: ${{ inputs.action == 'apply' }}
        run: |
          aws eks describe-nodegroup \
            --region "$AWS_REGION" \
            --cluster-name "$CLUSTER_NAME" \
            --nodegroup-name cicd-eks-rds-nodes \
            --query 'nodegroup.{Name:nodegroupName,Status:status,Issues:health.issues}' \
            --output json


      # ==========================================================
      # VERIFY KUBERNETES CONNECTION
      # ==========================================================

      - name: Check Kubernetes connection
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get nodes -o wide


      # ==========================================================
      # CREATE / UPDATE DATABASE SECRET
      # ==========================================================

      - name: Create database secret
        if: ${{ inputs.action == 'apply' }}
        env:
          DB_PASSWORD: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          kubectl create secret generic db-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client \
            -o yaml | kubectl apply -f -


      # ==========================================================
      # DEPLOY APPLICATION
      # ==========================================================

      - name: Deploy application
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml


      # ==========================================================
      # UPDATE IMAGE
      # ==========================================================

      - name: Update deployment image
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl set image deployment/sample-app \
            sample-app=$DOCKER_IMAGE:${{ github.sha }}


      # ==========================================================
      # WAIT FOR ROLLOUT
      # ==========================================================

      - name: Wait for rollout
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl rollout status deployment/sample-app \
            --timeout=300s


      # ==========================================================
      # CHECK PODS
      # ==========================================================

      - name: Check pods
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get pods -o wide


      # ==========================================================
      # CHECK SERVICES
      # ==========================================================

      - name: Check services
        if: ${{ inputs.action == 'apply' }}
        run: |
          kubectl get svc


      # ==========================================================
      # TERRAFORM DESTROY
      # ==========================================================

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ./terraform
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          terraform destroy \
            -auto-approve
